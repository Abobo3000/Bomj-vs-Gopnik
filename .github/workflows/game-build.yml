name: Build Godot game (Android + Windows)
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/bvg-debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download official Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GODOT_VERSION}-stable"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${VERSION}"
          curl -fL --retry 3 "${BASE}/Godot_v${VERSION}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 "/tmp/Godot_v${VERSION}_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "${BASE}/Godot_v${VERSION}_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version
      - name: Validate project imports and scripts
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee build/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' build/import.log; then
            echo 'GDScript parse/import errors detected'
            exit 1
          fi
      - name: Build Windows test executable
        run: |
          godot --headless --path . --export-debug "Windows Desktop" build/BomjVsGopnik.exe
      - name: Prepare Android debug SDK and signature
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          sdkmanager --sdk_root="${ANDROID_HOME}" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          keytool -genkeypair -v -keystore /tmp/bvg-debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Game Prototype,C=US"
      - name: Configure SDK inside Godot editor
        shell: bash
        run: |
          godot --headless --editor --path . --script res://tools/configure_android.gd
      - name: Export ARM64 Android APK
        shell: bash
        run: |
          godot --headless --path . --export-debug "Android" build/BomjVsGopnik-debug.apk
      - name: Upload playable test builds
        uses: actions/upload-artifact@v4
        with:
          name: BomjVsGopnik-first-playable
          path: |
            build/*.apk
            build/*.exe
            build/*.pck
          if-no-files-found: error
          retention-days: 14
      - name: Upload import log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-import-log
          path: build/import.log
          if-no-files-found: ignore
