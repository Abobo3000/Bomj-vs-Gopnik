name: Build Godot game (Android + Windows)
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/bvg-debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download validated CC0 high-detail 3D characters
        shell: bash
        run: |
          bash tools/fetch_assets.sh
          python3 tools/generate_textures.py
      - name: Commit bundled character assets into project branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/v1-visual-combat'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/*.glb assets/textures/*.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: vendor CC0 rigged PBR fighters [skip ci]"
            git push origin HEAD:feat/v1-visual-combat
          fi
      - name: Download official Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GODOT_VERSION}-stable"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${VERSION}"
          curl -fL --retry 3 "${BASE}/Godot_v${VERSION}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 "/tmp/Godot_v${VERSION}_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "${BASE}/Godot_v${VERSION}_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version
      - name: Validate project imports and scripts
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee build/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' build/import.log; then
            echo 'GDScript parse/import errors detected'
            exit 1
          fi
      - name: Gameplay smoke test (headless)
        shell: bash
        run: |
          set -o pipefail
          timeout 75s godot --headless --path . --quit-after 240 --script res://tools/smoke_test.gd 2>&1 | tee build/smoke.log
          grep -q 'SMOKE PASS:' build/smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|Assertion failed' build/smoke.log; then
            exit 1
          fi
      - name: Render live Godot gameplay screenshot
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          fi
          timeout 85s xvfb-run -a -s "-screen 0 1280x720x24" godot --rendering-method gl_compatibility --path . --script res://tools/render_preview.gd 2>&1 | tee build/render.log
          grep -q 'SCREENSHOT_OK' build/render.log
          test -s build/arena_capture.png
      - name: Publish gameplay screenshot in repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/v1-visual-combat'
        shell: bash
        run: |
          mkdir -p docs/screenshots
          cp build/arena_capture.png docs/screenshots/arena.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/arena.png
          if ! git diff --cached --quiet; then
            git commit -m "art: include actual Godot gameplay screenshot [skip ci]"
            git push origin HEAD:feat/v1-visual-combat
          fi
      - name: Build Windows test executable
        run: |
          godot --headless --path . --export-debug "Windows Desktop" build/BomjVsGopnik.exe
      - name: Prepare Android debug SDK and signature
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          SDKMGR="$(find "${ANDROID_HOME}" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager missing under ANDROID_HOME=${ANDROID_HOME}; installing official CLI"
            mkdir -p "${ANDROID_HOME}/cmdline-tools"
            curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/sdkcli.zip
            unzip -q /tmp/sdkcli.zip -d /tmp/sdk-tools
            mv /tmp/sdk-tools/cmdline-tools "${ANDROID_HOME}/cmdline-tools/latest"
            SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMGR" --sdk_root="${ANDROID_HOME}" --licenses >/dev/null || true
          "$SDKMGR" --sdk_root="${ANDROID_HOME}" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          keytool -genkeypair -v -keystore /tmp/bvg-debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Game Prototype,C=US"
      - name: Configure SDK inside Godot editor
        shell: bash
        run: |
          set -o pipefail
          timeout 70s godot --headless --editor --path . --quit-after 240 --script res://tools/configure_android.gd 2>&1 | tee build/configure.log
          grep -q 'Configuring Android SDK:' build/configure.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|Invalid access' build/configure.log; then
            exit 1
          fi
      - name: Export ARM64 Android APK
        shell: bash
        run: |
          godot --headless --path . --export-debug "Android" build/BomjVsGopnik-debug.apk
      - name: Upload playable test builds
        uses: actions/upload-artifact@v4
        with:
          name: BomjVsGopnik-v1-build
          path: |
            build/*.apk
            build/*.exe
            build/*.pck
            build/arena_capture.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload import log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-import-log
          path: build/import.log
          if-no-files-found: ignore
